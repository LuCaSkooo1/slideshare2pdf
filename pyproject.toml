[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slideshare2pdf"
version = "1.0.0"
description = "Download a SlideShare presentation as one PDF (terminal UI + CLI)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Lucas Ligas" }]
keywords = ["slideshare", "pdf", "tui", "textual", "downloader"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = [
    "requests",
    "pillow",
    "textual>=1.0",
    "img2pdf",
]

[project.urls]
Homepage = "https://github.com/LuCaSkooo1/slideshare2pdf"
Issues = "https://github.com/LuCaSkooo1/slideshare2pdf/issues"

[project.scripts]
slideshare2pdf = "slideshare2pdf:main"

[tool.hatch.build.targets.wheel]
py-modules = ["slideshare2pdf"]
